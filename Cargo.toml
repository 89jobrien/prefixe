[workspace]
members = ["crates/prefixe", "crates/prefixe-cli"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/89jobrien/prefixe"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
shell-words = "1"
tempfile = "3"
thiserror = "1"
glob = "0.3"
proptest = "1"
serde_json = "1"
regex = "1"
