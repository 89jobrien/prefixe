[package]
name = "prefixe-cli"
description = "CLI binary for the prefixe command-rewriting system"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "prefixe"
path = "src/main.rs"

[dependencies]
prefixe = { path = "../prefixe", version = "^0.5.0" }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
shell-words = { workspace = true }

[dev-dependencies]
prefixe = { path = "../prefixe", version = "^0.5.0", features = ["testing"] }
tempfile = { workspace = true }
